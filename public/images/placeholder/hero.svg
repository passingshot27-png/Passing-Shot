<!-- Illustration PROVISOIRE (style affiche de tournoi rétro) — à remplacer par une photo du shooting Passing Shot. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eee2"/>
      <stop offset="1" stop-color="#e6bfa9"/>
    </linearGradient>
    <pattern id="net" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0L10 10M10 0L0 10" stroke="#1f2420" stroke-opacity=".35" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- Soleil -->
  <circle cx="800" cy="500" r="300" fill="#fbf8f2" fill-opacity=".7"/>
  <circle cx="800" cy="500" r="220" fill="#e6bfa9" fill-opacity=".55"/>
  <!-- Tribunes -->
  <rect y="455" width="1600" height="95" fill="#2e4a37"/>
  <g fill="#213628">
    <rect y="470" width="1600" height="6"/><rect y="490" width="1600" height="6"/><rect y="510" width="1600" height="6"/>
  </g>
  <rect y="530" width="1600" height="20" fill="#1f2b45"/>
  <!-- Terre battue -->
  <rect y="550" width="1600" height="450" fill="#a85035"/>
  <polygon points="470,600 1130,600 1560,1000 40,1000" fill="#b85d3f"/>
  <g fill="none" stroke="#f4eee2" stroke-width="5" stroke-linejoin="round">
    <polygon points="470,600 1130,600 1560,1000 40,1000"/>
    <line x1="550" y1="600" x2="220" y2="1000"/>
    <line x1="1050" y1="600" x2="1380" y2="1000"/>
    <line x1="526" y1="630" x2="1074" y2="630"/>
    <line x1="325" y1="830" x2="1275" y2="830"/>
    <line x1="800" y1="630" x2="800" y2="830"/>
  </g>
  <!-- Filet -->
  <rect x="330" y="640" width="940" height="62" fill="url(#net)"/>
  <rect x="330" y="636" width="940" height="8" fill="#fbf8f2"/>
  <rect x="322" y="628" width="8" height="78" fill="#1f2420"/>
  <rect x="1270" y="628" width="8" height="78" fill="#1f2420"/>
  <!-- Trajectoire et balle -->
  <path d="M980 940 Q 980 160 1180 330" fill="none" stroke="#fbf8f2" stroke-width="3" stroke-dasharray="4 14" stroke-linecap="round"/>
  <circle cx="1190" cy="335" r="24" fill="#d6c46f"/>
  <path d="M1172 318 q 18 17 0 34 M1208 318 q -18 17 0 34" fill="none" stroke="#fbf8f2" stroke-width="2.5"/>
</svg>
