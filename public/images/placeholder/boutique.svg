<!-- Illustration PROVISOIRE — façade de la boutique de Suresnes (à remplacer par une photo). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="awning" width="120" height="200" patternUnits="userSpaceOnUse">
      <rect width="60" height="200" fill="#2e4a37"/>
      <rect x="60" width="60" height="200" fill="#f4eee2"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#e7dcc8"/>
  <!-- Façade -->
  <rect x="120" y="60" width="960" height="760" fill="#f4eee2"/>
  <rect x="120" y="60" width="960" height="760" fill="none" stroke="#d8cbb3" stroke-width="4"/>
  <!-- Enseigne -->
  <rect x="300" y="110" width="600" height="80" fill="#2e4a37"/>
  <circle cx="600" cy="150" r="20" fill="#e6bfa9"/>
  <rect x="380" y="146" width="160" height="8" fill="#e6bfa9"/>
  <rect x="660" y="146" width="160" height="8" fill="#e6bfa9"/>
  <!-- Store banne rayé -->
  <path d="M170 240 H1030 L1060 340 H140 Z" fill="url(#awning)"/>
  <path d="M140 340 Q 160 370 180 340 Q 200 370 220 340 Q 240 370 260 340 Q 280 370 300 340 Q 320 370 340 340 Q 360 370 380 340 Q 400 370 420 340 Q 440 370 460 340 Q 480 370 500 340 Q 520 370 540 340 Q 560 370 580 340 Q 600 370 620 340 Q 640 370 660 340 Q 680 370 700 340 Q 720 370 740 340 Q 760 370 780 340 Q 800 370 820 340 Q 840 370 860 340 Q 880 370 900 340 Q 920 370 940 340 Q 960 370 980 340 Q 1000 370 1020 340 Q 1040 370 1060 340 Z" fill="#2e4a37"/>
  <!-- Vitrines et porte -->
  <rect x="180" y="400" width="340" height="360" fill="#1f2b45"/>
  <rect x="680" y="400" width="340" height="360" fill="#1f2b45"/>
  <rect x="540" y="400" width="120" height="420" fill="#2e4a37"/>
  <circle cx="640" cy="620" r="6" fill="#c9a77c"/>
  <path d="M200 420 L320 420 L200 600 Z M700 420 L820 420 L700 600 Z" fill="#fbf8f2" fill-opacity=".12"/>
  <!-- Raquettes en vitrine -->
  <g fill="none" stroke="#e6bfa9" stroke-width="8">
    <ellipse cx="300" cy="540" rx="45" ry="60"/><line x1="300" y1="600" x2="300" y2="700"/>
    <ellipse cx="400" cy="540" rx="45" ry="60"/><line x1="400" y1="600" x2="400" y2="700"/>
  </g>
  <g fill="#fbf8f2"><rect x="760" y="560" width="70" height="110" rx="10"/><rect x="870" y="560" width="70" height="110" rx="10"/></g>
  <rect x="120" y="760" width="960" height="60" fill="#d8cbb3"/>
  <!-- Pavés -->
  <rect y="820" width="1200" height="80" fill="#c9bba2"/>
</svg>
